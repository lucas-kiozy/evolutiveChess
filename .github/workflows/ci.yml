name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Rodar testes
        shell: bash
        # Enquanto chess_engine/ e luna/ não entram na main, o pytest não coleta
        # nenhum teste e sai com código 5 ("no tests collected"). Tratamos o 5
        # como sucesso para o CI ficar verde antes dos PRs dos pacotes; qualquer
        # outro código diferente de zero continua falhando.
        run: python -m pytest || [ $? -eq 5 ]

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ruff
        run: pip install ruff
      # O código das frentes ainda tem avisos; o lint vira bloqueante quando
      # os donos limparem.
      - name: ruff check
        run: ruff check .
        continue-on-error: true
      - name: ruff format --check
        run: ruff format --check .
        continue-on-error: true

  perft-profundo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Enquanto chess_engine/tests não existe na main, o pytest sairia com
      # código 4 (caminho inexistente); os passos abaixo são pulados nesse caso.
      - name: Instalar dependências
        if: hashFiles('chess_engine/tests/**') != ''
        run: pip install -e ".[dev]"
      - name: Perft profundo
        if: hashFiles('chess_engine/tests/**') != ''
        env:
          CHESS_SLOW: "1"
        run: python -m pytest chess_engine/tests
